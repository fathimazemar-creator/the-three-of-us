<!DOCTYPE html>
<html>

<head>
<title>Our Scrapbook 📖</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#fff0f6,#f8f0ff);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.book{
    width:700px;
    background:white;
    padding:50px;
    border-radius:30px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,0.12);
    position:relative;
}

.tape{
    width:130px;
    height:25px;
    background:#ffd6e7;
    position:absolute;
    top:-10px;
    left:50%;
    transform:translateX(-50%) rotate(-4deg);
}

h1{
    color:#ff6fa5;
    font-size:45px;
}

.subtitle{
    color:#666;
    font-size:20px;
    line-height:1.8;
    margin-top:20px;
}

.button{
    display:block;
    width:280px;
    margin:18px auto;
    padding:15px;
    background:#ffe5f0;
    border-radius:25px;
    text-decoration:none;
    color:#ff5d9e;
    font-size:20px;
    transition:0.3s;
}

.button:hover{
    transform:scale(1.05);
}

.footer{
    margin-top:30px;
    color:#999;
}

</style>
</head>

<body>

<div class="book">

<div class="tape"></div>

<h1>📖 Our Scrapbook 📖</h1>

<div class="subtitle">
The story of three idiots 💖<br>
with zero braincells 🧠❌<br>
and infinite memories ✨
</div>

<br>

<button class="button" onclick="checkPassword()">
🔒 Open Secret Memories
</button>

<a href="mixtape.html" class="button">
🎵 Friendship Mixtape
</a>

<a href="games.html" class="button">
🎮 Friendship Games
</a>

<a href="letters.html" class="button">
💌 Secret Letters
</a>

<div class="footer">
Made with chaos, laughter and friendship 🌸
</div>

</div>

<script>

function checkPassword(){

let password =
prompt("Enter our secret password 💖");

if(password=="2025trip"){

window.location.href="secret.html";

}

else{

alert("Wrong password 😭");

}

}

</script>

</body>
</html>
