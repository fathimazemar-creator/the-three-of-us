<!DOCTYPE html>
<html>
<head>
<title>The Three Of Us 🌸</title>

<style>

body{
    background: linear-gradient(135deg,#fff0f6,#f8f0ff);
    font-family: Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    width:700px;
    background:white;
    padding:40px;
    border-radius:30px;
    box-shadow:0 15px 40px rgba(0,0,0,0.12);
    text-align:center;
    position:relative;
}

.tape{
    width:120px;
    height:25px;
    background:#ffd6e7;
    position:absolute;
    top:-10px;
    left:50%;
    transform:translateX(-50%) rotate(-3deg);
}

h1{
    color:#ff6fa5;
}

.names{
    color:#666;
    font-size:20px;
}

.message{
    background:#fff6fa;
    padding:20px;
    border-radius:20px;
    margin-top:20px;
}

</style>
</head>

<body>

<div class="card">

<div class="tape"></div>

<h1>🌸 The Three Of Us 🌸</h1>

<p class="names">
Fathima 💖 Smirna 💖 Sreenanda
</p>

<div class="message">
Three idiots.
Zero braincells.
Infinite memories. ✨
</div>

</div>

</body>
</html>
